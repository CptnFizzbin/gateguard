version: "1.0.0"
name: "$or (§7.4.7)"
rules:
  - [allow, Read, Article, { $or: [{ status: published }, { status: featured }] }]

cases:
  - name: "first alternative satisfied: allowed"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: allow

  - name: "second alternative satisfied: allowed"
    subjectData: { status: featured }
    action: Read
    subject: Article
    expected: allow

  - name: "no alternative satisfied: denied"
    subjectData: { status: draft }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$or with a non-array operand is a type issue, always false (§7.4.7)"
rules:
  - [allow, Read, Article, { $or: { status: published } }]

cases:
  - name: "operand is not an array: never matches"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$or: [] is vacuously false (§7.4.7)"
rules:
  - [allow, Read, Article, { $or: [] }]

cases:
  - name: "no alternative can ever be satisfied: always denied"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$and (§7.4.8)"
rules:
  - [allow, Read, Article, { $and: [{ status: published }, { view_count: { $gt: 100 } }] }]

cases:
  - name: "every conjunct satisfied: allowed"
    subjectData: { status: published, view_count: 200 }
    action: Read
    subject: Article
    expected: allow

  - name: "one conjunct unsatisfied: denied"
    subjectData: { status: published, view_count: 50 }
    action: Read
    subject: Article
    expected: deny

  - name: "the other conjunct unsatisfied: denied"
    subjectData: { status: draft, view_count: 200 }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$and with a non-array operand is a type issue, always false (§7.4.8)"
rules:
  - [allow, Read, Article, { $and: { status: published } }]

cases:
  - name: "operand is not an array: never matches"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$and: [] is vacuously true (§7.4.8)"
rules:
  - [allow, Read, Article, { $and: [] }]

cases:
  - name: "there is no unsatisfied conjunct: always allowed"
    subjectData: {}
    action: Read
    subject: Article
    expected: allow

  - name: "still always allowed regardless of the instance's other fields"
    subjectData: { anything: 1 }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$not (§7.4.9)"
rules:
  - [allow, Read, Article, { $not: { status: archived } }]

cases:
  - name: "inner condition is false: $not makes it true, so allowed"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: allow

  - name: "inner condition is true: $not makes it false, so denied"
    subjectData: { status: archived }
    action: Read
    subject: Article
    expected: deny

  - name: >
      $not is the exact negation of evaluating its inner condition against
      the same subject, with no special-casing for a missing field: the
      inner field condition on a missing "status" key evaluates false
      (§7.3), and $not negates that to true, so this is allowed - unlike
      $ne, which is explicitly false on a missing field (§7.3)
    subjectData: {}
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "multiple keys in one condition object are implicitly ANDed (§7.5)"
description: >
  An operator key MUST NOT consume the whole object or cause sibling keys
  to be ignored - mirrors the spec's own { $ne: null, status: open }
  example, applied to a nested field.
rules:
  - [allow, Update, Article, { author: { $ne: null, name: Alice } }]

cases:
  - name: "both the operator key and the field key are satisfied: allowed"
    subjectData: { author: { name: Alice } }
    action: Update
    subject: Article
    expected: allow

  - name: "the field key fails: denied, even though $ne null passes"
    subjectData: { author: { name: Bob } }
    action: Update
    subject: Article
    expected: deny

  - name: "author is explicitly null: the $ne: null key fails on its own, denying the whole object"
    subjectData: { author: null }
    action: Update
    subject: Article
    expected: deny

  - name: "outer field missing entirely: denied before either sibling key is even reached"
    subjectData: {}
    action: Update
    subject: Article
    expected: deny
