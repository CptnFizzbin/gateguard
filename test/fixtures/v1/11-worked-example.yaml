version: "1.0.0"
name: "Article Ownership Policy"
description: >
  End-to-end mirror of the spec's own Appendix worked example
  (SPEC_V1-0-0.md, "Appendix: worked example"). $hasRole is never
  registered by this conformance suite, so it always evaluates false
  (§7.4.12) - the admin-overrides-an-archive-deny case from the narrative
  appendix, which depends on a host application registering $hasRole, isn't
  reproducible here; the corresponding case below is a deny instead, for
  that reason.
meta:
  actions: [Read, Create, Update, Delete]
  subjects: [Article]
  customOperators: [$hasRole]
rules:
  - [allow, Read, _ANY_]
  - [allow, Create, Article]
  - [allow, Update, Article, { owner_id: 1 }]
  - [allow, Delete, Article, { owner_id: 1 }]
  - [deny, Delete, Article, { status: archived }]
  - [allow, Delete, Article, { $hasRole: admin }]

cases:
  - name: "Read is wide open on every subject, via the wildcard-subject rule"
    action: Read
    subject: Comment
    expected: allow

  - name: "Create on Article is unconditionally allowed"
    action: Create
    subject: Article
    expected: allow

  - name: "the owner can Update their own article"
    action: Update
    subject: Article
    subjectData: { owner_id: 1 }
    expected: allow

  - name: "a non-owner cannot Update the article"
    action: Update
    subject: Article
    subjectData: { owner_id: 2 }
    expected: deny

  - name: "the owner can Delete their own published article"
    action: Delete
    subject: Article
    subjectData: { owner_id: 1, status: published }
    expected: allow

  - name: >
      the owner cannot Delete their own archived article, because the deny
      rule is declared after the ownership allow rule - and $hasRole, which
      would otherwise let an admin override this, is unregistered here
    action: Delete
    subject: Article
    subjectData: { owner_id: 1, status: archived }
    expected: deny

  - name: "a non-owner cannot Delete a published article either"
    action: Delete
    subject: Article
    subjectData: { owner_id: 2, status: published }
    expected: deny
