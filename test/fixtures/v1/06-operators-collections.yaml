version: "1.0.0"
name: "$in (§7.4.4)"
rules:
  - [allow, Read, Article, { status: { $in: [published, featured] } }]

cases:
  - name: "value present in the list: allowed"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: allow

  - name: "another value present in the list: allowed"
    subjectData: { status: featured }
    action: Read
    subject: Article
    expected: allow

  - name: "value absent from the list: denied"
    subjectData: { status: draft }
    action: Read
    subject: Article
    expected: deny

  - name: "missing field: denied"
    subjectData: {}
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$in with a non-array operand is a type issue, always false (§7.4.4)"
rules:
  - [allow, Read, Article, { status: { $in: published } }]

cases:
  - name: "operand is not an array: never matches, even for an otherwise-plausible value"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$has (§7.4.5)"
rules:
  - [allow, Read, Article, { tags: { $has: featured } }]

cases:
  - name: "array contains the value: allowed"
    subjectData: { tags: [featured, news] }
    action: Read
    subject: Article
    expected: allow

  - name: "array does not contain the value: denied"
    subjectData: { tags: [news] }
    action: Read
    subject: Article
    expected: deny

  - name: "empty array: denied"
    subjectData: { tags: [] }
    action: Read
    subject: Article
    expected: deny

  - name: "missing field: denied"
    subjectData: {}
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$has against a non-array subject value is a type issue, always false (§7.4.5)"
rules:
  - [allow, Read, Article, { tags: { $has: featured } }]

cases:
  - name: "subject field is not an array: never matches"
    subjectData: { tags: featured }
    action: Read
    subject: Article
    expected: deny
