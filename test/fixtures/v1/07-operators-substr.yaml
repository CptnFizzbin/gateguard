version: "1.0.0"
name: "$substr: unanchored literal (§7.4.6)"
rules:
  - [allow, Read, Article, { title: { $substr: Rust } }]

cases:
  - name: "substring present: allowed"
    subjectData: { title: "Getting Started with Rust" }
    action: Read
    subject: Article
    expected: allow

  - name: "substring absent: denied"
    subjectData: { title: "Java Basics" }
    action: Read
    subject: Article
    expected: deny

  - name: "subject is coerced via String(subject); no match here, but not a type issue"
    subjectData: { title: 12345 }
    action: Read
    subject: Article
    expected: deny

  - name: "missing field: denied"
    subjectData: {}
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: literal matching - substring in middle"
rules:
  - [allow, Read, Article, { title: { $substr: oob } }]

cases:
  - name: "substring in middle: allowed"
    subjectData: { title: "foobar" }
    action: Read
    subject: Article
    expected: allow

  - name: "substring absent: denied"
    subjectData: { title: "fizzbuzz" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: start anchor (§7.4.6)"
rules:
  - [allow, Read, Article, { title: { $substr: "^Getting" } }]

cases:
  - name: "literal segment touches the start: allowed"
    subjectData: { title: "Getting Started" }
    action: Read
    subject: Article
    expected: allow

  - name: "literal segment doesn't touch the start: denied"
    subjectData: { title: "Not Getting Started" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: end anchor (§7.4.6)"
rules:
  - [allow, Read, Article, { title: { $substr: "Guide$" } }]

cases:
  - name: "literal segment touches the end: allowed"
    subjectData: { title: "Rust Guide" }
    action: Read
    subject: Article
    expected: allow

  - name: "literal segment doesn't touch the end: denied"
    subjectData: { title: "Guide to Rust" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: both anchors (exact match) (§7.4.6)"
rules:
  - [allow, Read, Article, { title: { $substr: "^Rust$" } }]

cases:
  - name: "exact match: allowed"
    subjectData: { title: Rust }
    action: Read
    subject: Article
    expected: allow

  - name: "extra trailing text: denied"
    subjectData: { title: "Rust Guide" }
    action: Read
    subject: Article
    expected: deny

  - name: "extra leading text: denied"
    subjectData: { title: "About Rust" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: wildcard (*) matches zero or more characters (§7.4.6)"
description: >
  In the simplified spec, * matches zero or more characters, not one or more.
rules:
  - [allow, Read, Article, { title: { $substr: "foo*bar" } }]

cases:
  - name: "zero characters between foo and bar: allowed"
    subjectData: { title: "foobar" }
    action: Read
    subject: Article
    expected: allow

  - name: "one character between foo and bar: allowed"
    subjectData: { title: "fooybar" }
    action: Read
    subject: Article
    expected: allow

  - name: "multiple characters between foo and bar: allowed"
    subjectData: { title: "foo123bar" }
    action: Read
    subject: Article
    expected: allow

  - name: "pattern mismatch: denied"
    subjectData: { title: "foobr" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: wildcard at start"
rules:
  - [allow, Read, Article, { title: { $substr: "*bar" } }]

cases:
  - name: "wildcard at start matches any prefix: allowed"
    subjectData: { title: "foobar" }
    action: Read
    subject: Article
    expected: allow

  - name: "zero characters before literal: allowed"
    subjectData: { title: "bar" }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$substr: wildcard at end"
rules:
  - [allow, Read, Article, { title: { $substr: "foo*" } }]

cases:
  - name: "wildcard at end matches any suffix: allowed"
    subjectData: { title: "foobar" }
    action: Read
    subject: Article
    expected: allow

  - name: "zero characters after literal: allowed"
    subjectData: { title: "foo" }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$substr: single wildcard character"
rules:
  - [allow, Read, Article, { title: { $substr: "*" } }]

cases:
  - name: "wildcard alone matches empty string: allowed"
    subjectData: { title: "" }
    action: Read
    subject: Article
    expected: allow

  - name: "wildcard alone matches any non-empty string: allowed"
    subjectData: { title: "anything" }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$substr: multiple wildcards"
description: >
  Multiple wildcards in sequence work as expected with zero-or-more matching.
rules:
  - [allow, Read, Article, { title: { $substr: "a*b*c" } }]

cases:
  - name: "multiple wildcards with zero and one character: allowed"
    subjectData: { title: "aXbYc" }
    action: Read
    subject: Article
    expected: allow

  - name: "multiple wildcards with zero characters each: allowed"
    subjectData: { title: "abc" }
    action: Read
    subject: Article
    expected: allow

  - name: "multiple wildcards with content at end: allowed"
    subjectData: { title: "aXbYcZ" }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$substr: anchored wildcard at start"
rules:
  - [allow, Read, Article, { title: { $substr: "^foo*" } }]

cases:
  - name: "start anchor with wildcard: allowed"
    subjectData: { title: "foobar" }
    action: Read
    subject: Article
    expected: allow

  - name: "doesn't start with pattern: denied"
    subjectData: { title: "barfoo" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: anchored wildcard at end"
rules:
  - [allow, Read, Article, { title: { $substr: "*bar$" } }]

cases:
  - name: "end anchor with wildcard: allowed"
    subjectData: { title: "foobar" }
    action: Read
    subject: Article
    expected: allow

  - name: "doesn't end with pattern: denied"
    subjectData: { title: "barfoo" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: both anchors with wildcard"
rules:
  - [allow, Read, Article, { title: { $substr: "^foo*bar$" } }]

cases:
  - name: "exact match with wildcard in middle: allowed"
    subjectData: { title: "foobar" }
    action: Read
    subject: Article
    expected: allow

  - name: "exact match with characters in wildcard: allowed"
    subjectData: { title: "foodybar" }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$substr: empty pattern"
rules:
  - [allow, Read, Article, { title: { $substr: "" } }]

cases:
  - name: "empty pattern matches empty string: allowed"
    subjectData: { title: "" }
    action: Read
    subject: Article
    expected: allow

  - name: "empty pattern matches any non-empty string: allowed"
    subjectData: { title: "anything" }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$substr: empty string with both anchors"
rules:
  - [allow, Read, Article, { title: { $substr: "^$" } }]

cases:
  - name: "^$ matches empty string: allowed"
    subjectData: { title: "" }
    action: Read
    subject: Article
    expected: allow

  - name: "^$ doesn't match non-empty string: denied"
    subjectData: { title: "anything" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: escaped special characters are literal (§7.4.6)"
rules:
  - [allow, Read, Article, { title: { $substr: "\\^literal" } }]

cases:
  - name: "the escaped caret is matched as a literal character, not an anchor, so it can appear mid-string"
    subjectData: { title: "a ^literal caret" }
    action: Read
    subject: Article
    expected: allow

  - name: "still an ordinary, unanchored substring match"
    subjectData: { title: "^literal at the start" }
    action: Read
    subject: Article
    expected: allow

  - name: "the literal text isn't present at all: denied"
    subjectData: { title: "no match here" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: escaped asterisk is literal"
rules:
  - [allow, Read, Article, { title: { $substr: "foo\\*bar" } }]

cases:
  - name: "escaped asterisk matches literal asterisk: allowed"
    subjectData: { title: "foo*bar" }
    action: Read
    subject: Article
    expected: allow

  - name: "escaped asterisk doesn't act as wildcard: denied"
    subjectData: { title: "fooXbar" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: escaped dollar sign is literal"
rules:
  - [allow, Read, Article, { title: { $substr: "end\\$" } }]

cases:
  - name: "escaped dollar sign matches literal dollar: allowed"
    subjectData: { title: "end$" }
    action: Read
    subject: Article
    expected: allow

  - name: "escaped dollar doesn't act as anchor: allowed"
    subjectData: { title: "end$suffix" }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$substr: escaped backslash is literal"
rules:
  - [allow, Read, Article, { title: { $substr: "\\\\backslash" } }]

cases:
  - name: "escaped backslash matches literal backslash: allowed"
    subjectData: { title: "\\backslash" }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$substr: trailing backslash is ignored (§7.4.6)"
rules:
  - [allow, Read, Article, { title: { $substr: "foo\\" } }]

cases:
  - name: "trailing backslash ignored: allowed"
    subjectData: { title: "foobar" }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$substr: an invalid pattern is a type issue, always false (§7.4.6)"
description: >
  An unescaped ^ anywhere but the first character, or an unescaped $
  anywhere but the last, is a structurally invalid pattern.
rules:
  - [allow, Read, Article, { title: { $substr: "mid^dle" } }]

cases:
  - name: "invalid pattern never matches, regardless of subject content"
    subjectData: { title: "mid^dle exactly" }
    action: Read
    subject: Article
    expected: deny

  - name: "invalid pattern never matches unrelated content either"
    subjectData: { title: "anything" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: invalid pattern with $ in middle"
rules:
  - [allow, Read, Article, { title: { $substr: "mid$dle" } }]

cases:
  - name: "invalid pattern with $ in middle never matches"
    subjectData: { title: "mid$dle" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$substr: a null or missing subject is an ordinary non-match, not a type issue (§7.4.6)"
rules:
  - [allow, Read, Article, { title: { $substr: x } }]

cases:
  - name: "explicit null subject value: denied"
    subjectData: { title: null }
    action: Read
    subject: Article
    expected: deny

  - name: "missing field: denied"
    subjectData: {}
    action: Read
    subject: Article
    expected: deny


