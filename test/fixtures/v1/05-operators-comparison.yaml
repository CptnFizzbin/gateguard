version: "1.0.0"
name: "$eq / $ne (§7.4.1, §7.4.2)"
rules:
  - [allow, Read, Article, { status: { $eq: published } }]
  - [allow, Update, Article]
  - [deny, Update, Article, { status: { $ne: published } }]

cases:
  - name: "$eq matches equal value"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: allow

  - name: "$eq does not match a different value"
    subjectData: { status: draft }
    action: Read
    subject: Article
    expected: deny

  - name: "$eq is never a type-mismatch: comparing to a different type is simply unequal"
    subjectData: { status: 1 }
    action: Read
    subject: Article
    expected: deny

  - name: "$ne is the exact negation of $eq: unpublished is denied by the more specific rule"
    subjectData: { status: draft }
    action: Update
    subject: Article
    expected: deny

  - name: "$ne is the exact negation of $eq: published falls through to the blanket allow"
    subjectData: { status: published }
    action: Update
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$gt (§7.4.3)"
rules:
  - [allow, Read, Article, { view_count: { $gt: 100 } }]

cases:
  - name: "strictly greater: allowed"
    subjectData: { view_count: 150 }
    action: Read
    subject: Article
    expected: allow

  - name: "equal to the boundary: denied ($gt is strict)"
    subjectData: { view_count: 100 }
    action: Read
    subject: Article
    expected: deny

  - name: "less than the boundary: denied"
    subjectData: { view_count: 50 }
    action: Read
    subject: Article
    expected: deny

  - name: "a numeric-looking string is never coerced: type issue, denied"
    subjectData: { view_count: "150" }
    action: Read
    subject: Article
    expected: deny

  - name: "missing field: denied"
    subjectData: {}
    action: Read
    subject: Article
    expected: deny

