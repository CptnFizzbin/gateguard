# Test cases for policy-03-complex-conditions.yaml
#
# Each test exercises `policy.can(action, subject)` (optionally with a
# concrete `subjectData` instance to evaluate rule conditions against) and
# asserts the boolean result KeyCard should return.
#
# Fields:
#   name        - human readable description of the case
#   action      - the action being checked
#   subject     - the subject type name being checked
#   subjectData - (optional) the object instance to check conditions against;
#                 omitted when the check is against the bare subject type
#   expected    - the expected result of policy.can(action, subject[, subjectData])

version: 1
policy: policy-03-complex-conditions.yaml
tests:
  - name: "allows Read on the Article type"
    action: Read
    subject: Article
    expected: true

  - name: "allows Create on the Article type"
    action: Create
    subject: Article
    expected: true

  - name: "allows Update for the owner with published (non-archived) status"
    action: Update
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: true

  - name: "allows Update for the owner with draft (non-archived) status"
    action: Update
    subject: Article
    subjectData:
      id: 2
      owner_id: 1
      title: "TypeScript Best Practices"
      status: draft
      view_count: 0
    expected: true

  - name: "denies Update for a non-owner even with non-archived status"
    action: Update
    subject: Article
    subjectData:
      id: 5
      owner_id: 3
      title: "api design fundamentals"
      status: draft
      view_count: 10
    expected: false

  - name: "denies Update for the owner when the article is archived"
    action: Update
    subject: Article
    subjectData:
      id: 99
      owner_id: 1
      title: "Old Draft"
      status: archived
      view_count: 10
    expected: false

  - name: "allows Delete on a non-archived article regardless of owner"
    action: Delete
    subject: Article
    subjectData:
      id: 5
      owner_id: 3
      title: "api design fundamentals"
      status: draft
      view_count: 10
    expected: true

  - name: "denies Delete on an archived article"
    action: Delete
    subject: Article
    subjectData:
      id: 3
      owner_id: 2
      title: "Java for Beginners"
      status: archived
      view_count: 2000
    expected: false

  - name: "denies Update on the bare Article type (conditions need owner_id/status)"
    action: Update
    subject: Article
    expected: false
