# Test cases for policy-04-multi-resource.yaml
#
# Each test exercises `policy.can(action, subject)` (optionally with a
# concrete `subjectData` instance to evaluate rule conditions against) and
# asserts the boolean result KeyCard should return.
#
# Fields:
#   name        - human readable description of the case
#   action      - the action being checked
#   subject     - the subject type name being checked
#   subjectData - (optional) the object instance to check conditions against;
#                 omitted when the check is against the bare subject type
#   expected    - the expected result of policy.can(action, subject[, subjectData])

version: 1
policy: policy-04-multi-resource.yaml
tests:
  - name: "allows Read on the Article type"
    action: Read
    subject: Article
    expected: true

  - name: "allows Read on the Comment type"
    action: Read
    subject: Comment
    expected: true

  - name: "allows Read on the User type"
    action: Read
    subject: User
    expected: true

  - name: "allows Delete on Article for the owner"
    action: Delete
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: true

  - name: "denies Delete on Article for a non-owner"
    action: Delete
    subject: Article
    subjectData:
      id: 3
      owner_id: 2
      title: "Java for Beginners"
      status: archived
      view_count: 2000
    expected: false

  - name: "allows Update Comment for its author"
    action: Update
    subject: Comment
    subjectData:
      id: 1
      article_id: 1
      author_id: 1
      text: "Great introduction!"
      approved: true
    expected: true

  - name: "denies Update Comment for a non-author"
    action: Update
    subject: Comment
    subjectData:
      id: 4
      article_id: 3
      author_id: 3
      text: "Outdated"
      approved: true
    expected: false

  - name: "denies Delete Comment for a non-author"
    action: Delete
    subject: Comment
    subjectData:
      id: 4
      article_id: 3
      author_id: 3
      text: "Outdated"
      approved: true
    expected: false

  - name: "allows Update User for the matching id"
    action: Update
    subject: User
    subjectData:
      id: 1
      name: "Alice"
      email: "alice@example.com"
      role: author
      created_at: 2024-01-01
    expected: true

  - name: "denies Update User for a different id"
    action: Update
    subject: User
    subjectData:
      id: 3
      name: "Charlie"
      email: "charlie@example.com"
      role: admin
      created_at: 2024-03-10
    expected: false

  - name: "denies Delete User for any user (deny rule, no allow rule either)"
    action: Delete
    subject: User
    subjectData:
      id: 1
      name: "Alice"
      email: "alice@example.com"
      role: author
      created_at: 2024-01-01
    expected: false

  - name: "denies Delete User even for an admin (deny rule)"
    action: Delete
    subject: User
    subjectData:
      id: 3
      name: "Charlie"
      email: "charlie@example.com"
      role: admin
      created_at: 2024-03-10
    expected: false
