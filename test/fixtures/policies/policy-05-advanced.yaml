version: 1
name: "Advanced Admin Policy"
description: "Complex nested conditions with logic operators"

allow:
  - [Read, Article]
  - [Create, Article]
  - [Update, Article, {
      $or: [
        {
          $and: [
            { owner_id: 1 },
            { status: { $in: [draft, published] } }
          ]
        },
        { role: admin }
      ]
    }]
  - [Delete, Article, {
      $and: [
        {
          $or: [
            { owner_id: 1 },
            { role: admin }
          ]
        },
        { status: { $not: archived } },
        { view_count: { $lt: 100 } }
      ]
    }]
  - [Publish, Article, {
      $and: [
        { owner_id: 1 },
        { status: draft },
        { title: { $rgx: "^[A-Z].*" } }
      ]
    }]

deny:
  - [Delete, Article, {
      $and: [
        { view_count: { $gte: 1000 } },
        { status: published }
      ]
    }]
