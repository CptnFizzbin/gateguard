version: 1
policy: policy-01-simple.yaml
tests:
  - name: "allows Read on the Article type"
    action: Read
    subject: Article
    expected: true

  - name: "allows Read on any article instance regardless of owner"
    action: Read
    subject: Article
    subjectData:
      id: 3
      owner_id: 2
      title: "Java for Beginners"
      status: archived
      view_count: 2000
    expected: true

  - name: "denies Create on the bare Article type (condition needs owner_id)"
    action: Create
    subject: Article
    expected: false

  - name: "allows Create for owner_id 1"
    action: Create
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: true

  - name: "denies Create for owner_id 2"
    action: Create
    subject: Article
    subjectData:
      id: 3
      owner_id: 2
      title: "Java for Beginners"
      status: archived
      view_count: 2000
    expected: false

  - name: "denies Update on Article (no rule allows it)"
    action: Update
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: false

  - name: "denies Delete on Article (no rule allows it)"
    action: Delete
    subject: Article
    expected: false

  - name: "denies Read on an unrelated subject type"
    action: Read
    subject: Comment
    expected: false
