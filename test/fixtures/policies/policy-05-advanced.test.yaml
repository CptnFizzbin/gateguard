# Test cases for policy-05-advanced.yaml
#
# Each test exercises `policy.can(action, subject)` (optionally with a
# concrete `subjectData` instance to evaluate rule conditions against) and
# asserts the boolean result KeyCard should return.
#
# Fields:
#   name        - human readable description of the case
#   action      - the action being checked
#   subject     - the subject type name being checked
#   subjectData - (optional) the object instance to check conditions against;
#                 omitted when the check is against the bare subject type
#   expected    - the expected result of policy.can(action, subject[, subjectData])

version: 1
policy: policy-05-advanced.yaml
tests:
  - name: "allows Read on the Article type"
    action: Read
    subject: Article
    expected: true

  - name: "allows Create on the Article type"
    action: Create
    subject: Article
    expected: true

  - name: "allows Update for the owner with draft status"
    action: Update
    subject: Article
    subjectData:
      id: 2
      owner_id: 1
      title: "TypeScript Best Practices"
      status: draft
      view_count: 0
    expected: true

  - name: "allows Update for the owner with published status"
    action: Update
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: true

  - name: "denies Update for the owner when the article is archived"
    action: Update
    subject: Article
    subjectData:
      id: 99
      owner_id: 1
      status: archived
      view_count: 10
    expected: false

  - name: "allows Update for an admin regardless of ownership or status"
    action: Update
    subject: Article
    subjectData:
      id: 3
      owner_id: 2
      status: archived
      view_count: 2000
      role: admin
    expected: true

  - name: "allows Delete for the owner with low view count and non-archived status"
    action: Delete
    subject: Article
    subjectData:
      id: 4
      owner_id: 1
      title: "Advanced Rust Patterns"
      status: published
      view_count: 50
    expected: true

  - name: "denies Delete for the owner when view count is not low enough"
    action: Delete
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: false

  - name: "denies Delete for the owner due to the deny rule (high view count, published)"
    action: Delete
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 1500
    expected: false

  - name: "denies Delete for the owner when the article is archived"
    action: Delete
    subject: Article
    subjectData:
      id: 99
      owner_id: 1
      status: archived
      view_count: 10
    expected: false

  - name: "allows Delete for an admin with low view count and non-archived status"
    action: Delete
    subject: Article
    subjectData:
      id: 50
      owner_id: 2
      status: draft
      view_count: 5
      role: admin
    expected: true

  - name: "denies Delete for a non-owner, non-admin user"
    action: Delete
    subject: Article
    subjectData:
      id: 5
      owner_id: 3
      title: "api design fundamentals"
      status: draft
      view_count: 10
    expected: false

  - name: "allows Publish for the owner with draft status and capitalized title"
    action: Publish
    subject: Article
    subjectData:
      id: 2
      owner_id: 1
      title: "TypeScript Best Practices"
      status: draft
      view_count: 0
    expected: true

  - name: "denies Publish for a non-owner"
    action: Publish
    subject: Article
    subjectData:
      id: 5
      owner_id: 3
      title: "api design fundamentals"
      status: draft
      view_count: 10
    expected: false

  - name: "denies Publish for the owner when the title is not capitalized"
    action: Publish
    subject: Article
    subjectData:
      id: 5
      owner_id: 1
      title: "api design fundamentals"
      status: draft
      view_count: 10
    expected: false

  - name: "denies Publish for the owner when the status is not draft"
    action: Publish
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: false
