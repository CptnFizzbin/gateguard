# Test cases for policy-02-ownership.yaml
#
# Each test exercises `policy.can(action, subject)` (optionally with a
# concrete `subjectData` instance to evaluate rule conditions against) and
# asserts the boolean result KeyCard should return.
#
# Fields:
#   name        - human readable description of the case
#   action      - the action being checked
#   subject     - the subject type name being checked
#   subjectData - (optional) the object instance to check conditions against;
#                 omitted when the check is against the bare subject type
#   expected    - the expected result of policy.can(action, subject[, subjectData])

version: 1
policy: policy-02-ownership.yaml
tests:
  - name: "allows Read on the Article type"
    action: Read
    subject: Article
    expected: true

  - name: "allows Create on the Article type"
    action: Create
    subject: Article
    expected: true

  - name: "allows Update for the owner (owner_id 1)"
    action: Update
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: true

  - name: "denies Update for a non-owner (owner_id 2)"
    action: Update
    subject: Article
    subjectData:
      id: 3
      owner_id: 2
      title: "Java for Beginners"
      status: archived
      view_count: 2000
    expected: false

  - name: "allows Delete for the owner (owner_id 1)"
    action: Delete
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: true

  - name: "denies Delete for a non-owner (owner_id 2)"
    action: Delete
    subject: Article
    subjectData:
      id: 3
      owner_id: 2
      title: "Java for Beginners"
      status: archived
      view_count: 2000
    expected: false

  - name: "denies Update on the bare Article type (condition needs owner_id)"
    action: Update
    subject: Article
    expected: false

  - name: "denies Publish on Article (no rule allows it)"
    action: Publish
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
      title: "Getting Started with Rust"
      status: published
      view_count: 500
    expected: false
