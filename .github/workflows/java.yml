name: Java

on:
  push:
    branches: [main]
    paths:
      - "impl/java/**"
      - "test/fixtures/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "impl/java/**"
      - "test/fixtures/**"
      - ".github/workflows/java.yml"

defaults:
  run:
    working-directory: impl/java

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: impl/java/pom.xml

      - name: Build and test
        run: mvn -B verify
